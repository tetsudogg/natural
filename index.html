<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Natural</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="title" class="overlay">
      <div class="title-card">
        <h1>Natural</h1>
        <p class="tagline">美しい大自然のなかで、ただ過ごす。</p>
        <p id="loading" class="loading">森を準備しています…</p>
        <button id="start" type="button" hidden>森に入る</button>
        <ul class="keys">
          <li><kbd>W A S D</kbd> 歩く　<kbd>Shift</kbd> 走る　マウスで見回す</li>
          <li><kbd>C</kbd> 一人称／三人称　<kbd>V</kbd> 眺めモード　<kbd>F</kbd> 全画面</li>
          <li><kbd>T</kbd> 時間の速さ　<kbd>Q</kbd> 画質　<kbd>H</kbd> 操作の表示</li>
          <li><kbd>E</kbd> 枝を拾う／くべる　<kbd>B</kbd> 焚き火を組む（枝 5 本）</li>
        </ul>
        <p class="note">音が出ます。ヘッドホンがおすすめです。</p>
      </div>
    </div>

    <div id="pause" class="overlay" hidden>
      <div class="title-card small">
        <p>クリックで森に戻る</p>
      </div>
    </div>

    <div id="hud">
      <div id="help" class="help">
        <kbd>WASD</kbd> 歩く　<kbd>Shift</kbd> 走る　<kbd>C</kbd> 視点　<kbd>V</kbd> 眺めモード　<kbd>F</kbd> 全画面　<kbd>E</kbd> 拾う　<kbd>B</kbd> 焚き火　<kbd>T</kbd> 時間　<kbd>Q</kbd> 画質　<kbd>H</kbd> 隠す
      </div>
      <button id="view-btn" type="button" title="眺めモード (V)">眺める</button>
    </div>

    <div id="toast" aria-live="polite"></div>
    <div id="hint"></div>
    <div id="pack"></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
